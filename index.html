<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#03050d">
<meta name="description" content="نور 900 v17.1 — محرك بحث عربي آمن">
<title>⚡ نور 900 — v17.1 Security Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{
  --bg-0:#03050d; --bg-1:#070b18; --bg-2:#0c1225; --bg-3:#111a33;
  --card:rgba(255,255,255,.05); --card-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.18);
  --txt:#eef3ff; --txt-2:#b9c6e6; --txt-3:#7c8bb3; --txt-4:#4d5b80;
  --acc:#4d8cff; --acc-2:#8b5cf6;
  --kali:#00ff9d; --kali-2:#00d4ff;
  --gold:#ffd700; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --visit:#10b981;
  --radius:18px; --radius-lg:24px;
  --transition:.22s cubic-bezier(.22,.61,.36,1);
  --shadow-md:0 12px 32px -12px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -26px rgba(0,0,0,.9);
}
body.light{
  --bg-0:#f5f7fc; --bg-1:#eef2f9; --bg-2:#ffffff; --bg-3:#f0f3fa;
  --card:rgba(15,20,40,.04); --card-2:rgba(15,20,40,.07);
  --border:rgba(15,20,40,.09); --border-2:rgba(15,20,40,.16);
  --txt:#0a1025; --txt-2:#2d3a5c; --txt-3:#5d6b8f; --txt-4:#8a96b5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, #1a2c66 0%, transparent 55%),
    radial-gradient(900px 500px at 85% 100%, #3a1d63 0%, transparent 55%),
    var(--bg-0);
  color:var(--txt);min-height:100vh;line-height:1.7;
  -webkit-font-smoothing:antialiased;font-size:15.5px;
  overflow-x:hidden;
}
body.light{
  background:
    radial-gradient(1200px 600px at 15% -10%, #dbe5ff 0%, transparent 55%),
    radial-gradient(900px 500px at 85% 100%, #ecdcff 0%, transparent 55%),
    var(--bg-0);
}
body.kali{
  background:
    radial-gradient(1200px 600px at 15% -10%, #003d2a 0%, transparent 55%),
    radial-gradient(900px 500px at 85% 100%, #002a3d 0%, transparent 55%),
    #03050d !important;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--acc),var(--acc-2));border-radius:99px}
body.kali ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--kali),var(--kali-2))}

/* ===== Splash Screen ===== */
#splash{
  position:fixed;inset:0;z-index:3000;
  display:grid;place-items:center;
  background:radial-gradient(900px 500px at 20% 15%, #1a2c66 0%, transparent 55%),
             radial-gradient(700px 500px at 80% 85%, #3a1d63 0%, transparent 55%),
             #03050d;
  transition:opacity .5s ease, visibility .5s;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center}
.splash-logo{
  width:96px;height:96px;margin:0 auto 22px;
  border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4d8cff,#8b5cf6);
  box-shadow:0 0 60px rgba(77,140,255,.6);
  font-size:48px;
  animation:pop .7s cubic-bezier(.22,.61,.36,1);
}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.splash-title{
  font-size:32px;font-weight:900;letter-spacing:-.8px;
  background:linear-gradient(135deg,#fff,#8bb4ff,#c4a6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:6px;
  animation:fadeUp .6s .2s backwards;
}
.splash-version{
  font-size:14px;font-weight:800;color:#7c8bb3;letter-spacing:2.5px;
  animation:fadeUp .6s .4s backwards;
}
.splash-edition{
  display:inline-block;margin-top:14px;padding:5px 14px;
  border-radius:99px;font-size:11px;font-weight:900;
  background:rgba(0,255,157,.1);color:#00ff9d;
  border:1px solid rgba(0,255,157,.3);
  letter-spacing:1.2px;
  animation:fadeUp .6s .6s backwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.splash-bar{
  width:200px;height:3px;background:rgba(255,255,255,.1);
  border-radius:99px;margin:24px auto 0;overflow:hidden;
}
.splash-bar span{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#4d8cff,#8b5cf6);
  border-radius:99px;animation:load 1.5s ease forwards;
}
@keyframes load{to{width:100%}}

/* ===== التطبيق ===== */
#app{display:none;padding-bottom:80px}
#app.show{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 0}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;gap:10px;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px);
  background:rgba(3,5,13,.82);
  margin:0 -16px;
  padding-inline:16px;
  border-bottom:1px solid var(--border);
}
body.light header{background:rgba(245,247,252,.85)}
body.kali header{background:rgba(3,5,13,.85)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.logo{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#4d8cff,#8b5cf6);
  font-size:19px;font-weight:900;
  box-shadow:0 4px 14px -4px rgba(77,140,255,.6);
}
body.kali .logo{background:linear-gradient(135deg,#00ff9d,#00d4ff)}
.brand b{font-size:15px;font-weight:900;display:block;line-height:1.2}
.brand small{font-size:9.5px;color:var(--txt-3);font-weight:700;letter-spacing:.5px}
.actions{display:flex;gap:6px;align-items:center}
.icon{
  width:38px;height:38px;border-radius:11px;
  border:1px solid var(--border);background:var(--card);
  color:var(--txt-2);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:var(--transition);
  flex-shrink:0;
}
.icon:hover{background:var(--card-2);color:var(--txt)}
.icon.on{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#fff;border-color:transparent}
body.kali .icon.on{background:linear-gradient(135deg,var(--kali),var(--kali-2));color:#001a10}

/* ===== البحث ===== */
.search-section{padding:16px 0 8px;position:relative}
.search-wrap{position:relative}
.search{
  display:flex;gap:8px;
  background:var(--bg-2);
  border:1.5px solid var(--border-2);
  border-radius:20px;padding:6px 6px 6px 16px;
  transition:var(--transition);
  box-shadow:var(--shadow-md);
}
body.kali .search{background:#071a14}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(77,140,255,.12)}
body.kali .search:focus-within{border-color:var(--kali);box-shadow:0 0 0 4px rgba(0,255,157,.12)}
.search-ico{font-size:18px;color:var(--txt-3);align-self:center}
.search input{
  flex:1;background:transparent;border:0;outline:0;color:var(--txt);
  font-family:inherit;font-size:16px;min-width:0;padding:12px 0;
}
.search input::placeholder{color:var(--txt-4)}
.clear-btn{
  width:32px;height:32px;border-radius:10px;border:0;background:transparent;
  color:var(--txt-3);cursor:pointer;font-size:15px;
  display:none;align-items:center;justify-content:center;
  transition:var(--transition);align-self:center;
}
.clear-btn.show{display:flex}
.clear-btn:hover{background:var(--card);color:var(--txt)}
.search button.go{
  border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:14px;
  padding:12px 22px;border-radius:15px;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc-2));
  transition:var(--transition);white-space:nowrap;
}
.search button.go:hover{transform:translateY(-1px);filter:brightness(1.1)}
.search button.go:disabled{opacity:.5;cursor:not-allowed;transform:none}
body.kali .search button.go{background:linear-gradient(135deg,var(--kali),var(--kali-2));color:#001a10}

/* الاقتراحات */
.suggestions{
  position:absolute;top:calc(100% + 6px);inset-inline:0;
  background:var(--bg-2);border:1.5px solid var(--border-2);
  border-radius:16px;padding:6px;
  box-shadow:var(--shadow-lg);
  max-height:320px;overflow-y:auto;
  z-index:60;
  display:none;
  animation:slideDown .18s ease;
}
body.kali .suggestions{background:#071a14}
.suggestions.show{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sugg{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:11px;
  cursor:pointer;transition:var(--transition);
  font-size:14.5px;
}
.sugg:hover{background:var(--card-2)}
.sugg .ico{font-size:15px;flex-shrink:0;color:var(--txt-3)}
.sugg .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .arrow{color:var(--txt-4);font-size:12px}

/* ===== التبويبات ===== */
.tabs-bar{
  display:flex;gap:6px;overflow-x:auto;
  padding:12px 0;margin:0 -16px;
  padding-inline:16px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{
  padding:8px 15px;border-radius:99px;border:1px solid var(--border);
  background:var(--card);color:var(--txt-3);
  font-family:inherit;font-size:13px;font-weight:800;
  cursor:pointer;transition:var(--transition);
  white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:6px;
}
.tab-btn:hover{color:var(--txt);border-color:var(--border-2)}
.tab-btn.on{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#fff;border-color:transparent}
body.kali .tab-btn.on{background:linear-gradient(135deg,var(--kali),var(--kali-2));color:#001a10}
.tab-btn .badge{
  background:rgba(255,255,255,.2);padding:1px 7px;border-radius:99px;
  font-size:10px;font-weight:900;
}
.tab-btn.on .badge{background:rgba(0,0,0,.2);color:#fff}

/* ===== Quick chips ===== */
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{
  display:flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:99px;
  border:1px solid var(--border);background:var(--card);
  color:var(--txt-3);font-family:inherit;font-size:12px;
  font-weight:800;cursor:pointer;transition:var(--transition);
}
.chip:hover{color:var(--txt);border-color:var(--border-2)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#fff;border-color:transparent}
body.kali .chip.on{background:linear-gradient(135deg,var(--kali),var(--kali-2));color:#001a10}

/* ===== History ===== */
.history{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.history-item{
  display:flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:99px;
  background:var(--card);border:1px solid var(--border);
  font-size:12px;font-weight:700;color:var(--txt-3);
  cursor:pointer;transition:var(--transition);
}
.history-item:hover{color:var(--txt);border-color:var(--border-2)}
.history-item .x{
  color:var(--txt-4);font-size:14px;line-height:1;
  padding:0 2px;
}
.history-item .x:hover{color:var(--err)}
.history-clear{
  padding:6px 11px;border-radius:99px;
  background:transparent;border:1px dashed var(--border-2);
  font-size:11.5px;font-weight:800;color:var(--txt-4);
  cursor:pointer;font-family:inherit;
}
.history-clear:hover{color:var(--err);border-color:var(--err)}

/* ===== Status ===== */
.status{text-align:center;padding:36px 20px;display:none}
.status.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{
  width:36px;height:36px;margin:0 auto 14px;border-radius:50%;
  border:3px solid var(--card-2);border-top-color:var(--acc);
  animation:spin .7s linear infinite;
}
body.kali .spin{border-top-color:var(--kali)}
@keyframes spin{to{transform:rotate(360deg)}}
.status-text{color:var(--txt-3);font-size:14px;font-weight:700}
.status-sub{color:var(--txt-4);font-size:12.5px;margin-top:4px}
.retry-btn{
  margin-top:14px;padding:9px 20px;border-radius:12px;
  border:1.5px solid var(--border-2);background:var(--card);
  color:var(--txt);font-family:inherit;font-weight:800;font-size:13px;
  cursor:pointer;transition:var(--transition);
}
.retry-btn:hover{background:var(--card-2)}

/* ===== بطاقة الموقع الرسمي ===== */
.official{
  margin-bottom:14px;padding:18px;border-radius:18px;
  background:linear-gradient(135deg,rgba(16,185,129,.13),rgba(59,130,246,.09));
  border:1.5px solid rgba(16,185,129,.4);
  animation:rise .35s ease;
}
.official-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:99px;
  background:linear-gradient(135deg,var(--visit),#059669);
  color:#fff;font-size:10.5px;font-weight:900;
  letter-spacing:.4px;margin-bottom:10px;
  cursor:help;
}
.official-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.fav{
  width:44px;height:44px;border-radius:11px;
  background:var(--card-2);display:grid;place-items:center;
  padding:6px;flex-shrink:0;border:1px solid var(--border);
}
.fav img{width:100%;height:100%;object-fit:contain;border-radius:7px}
.official-head h3{font-size:17px;font-weight:900;margin-bottom:2px}
.official-url{
  font-size:12px;color:var(--visit);font-weight:800;
  font-family:ui-monospace,monospace;word-break:break-all;
}

/* ===== Answer box ===== */
.answer{
  margin-bottom:14px;padding:18px;border-radius:18px;
  background:linear-gradient(135deg,rgba(77,140,255,.12),rgba(139,92,246,.09));
  border:1.5px solid rgba(139,92,246,.3);
  animation:rise .35s ease;
  display:none;
}
.answer.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.answer-label{
  font-size:11.5px;font-weight:900;color:var(--acc-2);
  margin-bottom:8px;letter-spacing:.4px;
  display:flex;align-items:center;gap:6px;
}
body.kali .answer-label{color:var(--kali)}
.answer h3{font-size:16.5px;margin-bottom:8px;font-weight:900;line-height:1.4}
.answer p{color:var(--txt-2);line-height:1.95;font-size:14.5px}

/* ===== Results bar ===== */
.results-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;margin-bottom:8px;
  color:var(--txt-3);font-size:12.5px;font-weight:700;
  flex-wrap:wrap;gap:8px;
}
.results-bar b{color:var(--acc);font-weight:900}
body.kali .results-bar b{color:var(--kali)}
.hidden-note{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:99px;
  background:rgba(245,158,11,.13);color:#fbbf24;
  font-size:11.5px;font-weight:800;
  border:1px solid rgba(245,158,11,.3);
  margin-bottom:10px;
}

/* ===== Results ===== */
.results{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:16px;padding:16px;
  transition:var(--transition);
  animation:rise .3s ease backwards;
}
.card:hover{
  border-color:rgba(77,140,255,.4);
  background:var(--card-2);
  transform:translateY(-2px);
  box-shadow:0 16px 40px -20px rgba(77,140,255,.7);
}
body.kali .card:hover{border-color:rgba(0,255,157,.4);box-shadow:0 16px 40px -20px rgba(0,255,157,.6)}
.card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.card-fav{
  width:36px;height:36px;border-radius:10px;
  background:var(--card-2);display:grid;place-items:center;
  padding:5px;flex-shrink:0;border:1px solid var(--border);
}
.card-fav img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.card-info{flex:1;min-width:0}
.card h3{
  font-size:16px;font-weight:900;line-height:1.4;
  margin-bottom:4px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.official-mark{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:99px;
  background:rgba(16,185,129,.15);color:#10b981;
  font-size:10px;font-weight:900;
  border:1px solid rgba(16,185,129,.35);
  cursor:help;flex-shrink:0;
}
.card-url{
  font-size:11.5px;color:var(--visit);font-weight:700;
  font-family:ui-monospace,monospace;
  word-break:break-all;
  display:flex;align-items:center;gap:5px;
  flex-wrap:wrap;
}
.warn-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:99px;
  background:rgba(245,158,11,.15);color:#fbbf24;
  font-size:10px;font-weight:900;
  border:1px solid rgba(245,158,11,.3);
  cursor:help;
}
.card-snippet{
  color:var(--txt-2);font-size:13.5px;line-height:1.9;
  margin:8px 0;
}
.card-foot{
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding-top:10px;border-top:1px dashed var(--border);
}
.card-source{
  padding:3px 10px;border-radius:99px;
  background:rgba(77,140,255,.14);color:#93b8ff;
  font-size:10.5px;font-weight:800;
  border:1px solid rgba(77,140,255,.24);
}
body.kali .card-source{background:rgba(0,255,157,.12);color:var(--kali);border-color:rgba(0,255,157,.3)}
.btn-mini{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 11px;border-radius:9px;
  border:1.5px solid var(--border);background:transparent;
  color:var(--txt-2);font-family:inherit;font-size:11.5px;
  font-weight:800;cursor:pointer;transition:var(--transition);
  text-decoration:none;
}
.btn-mini:hover{background:var(--card-2);color:var(--txt);border-color:var(--border-2)}
.btn-mini.visit{
  background:linear-gradient(135deg,var(--visit),#059669);
  color:#fff;border-color:transparent;
  margin-inline-start:auto;
}
.btn-mini.visit:hover{filter:brightness(1.1)}

/* ===== Empty state ===== */
.empty{
  text-align:center;padding:40px 20px;
  background:var(--card);border-radius:18px;
  border:1.5px dashed var(--border-2);
}
.empty h3{font-size:16px;margin-bottom:8px;color:var(--txt)}
.empty p{color:var(--txt-3);font-size:13.5px;margin-bottom:14px}
.empty-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty-links a{
  padding:8px 14px;border-radius:11px;
  background:var(--card-2);border:1px solid var(--border);
  color:var(--txt);text-decoration:none;
  font-size:12.5px;font-weight:800;
  transition:var(--transition);
}
.empty-links a:hover{background:var(--card-3);transform:translateY(-1px)}

/* ===== Kali Panel ===== */
.kali-panel{
  position:fixed;inset-inline:12px;bottom:12px;z-index:90;
  background:linear-gradient(180deg,rgba(0,20,15,.97),rgba(0,10,8,.97));
  border:1.5px solid rgba(0,255,157,.4);
  border-radius:18px;padding:14px;
  display:none;
  box-shadow:0 24px 60px -20px rgba(0,255,157,.4);
  max-width:calc(100vw - 24px);
}
.kali-panel.show{display:block;animation:rise .3s ease}
.kali-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.kali-head h4{
  color:var(--kali);font-size:12px;font-weight:900;
  letter-spacing:1px;display:flex;align-items:center;gap:7px;
}
.kali-close{
  background:transparent;border:0;color:#8fbfa9;
  cursor:pointer;font-size:14px;padding:2px 6px;
}
.kali-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
  gap:8px;
}
.stat-box{
  background:rgba(0,255,157,.05);
  border:1px solid rgba(0,255,157,.18);

    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

    return url.href;

  if (!u) return "";

    const d = url.hostname + (url.pathname !== "/" ? url.pathname : "");

function detectOfficial(q){
  if (!State.official) return null;
  const clean = q.toLowerCase().trim()
    .replace(/^(موقع|رابط|صفحة|حساب|تطبيق)\s+/i, "")
    .replace(/\s+(الرسمي|الرسمية|رسمي|رسمية)$/i, "")
    .trim();
  if (OFFICIAL_SITES[clean]) return { name: q, url: OFFICIAL_SITES[clean], isOfficial: true };
  if (OFFICIAL_SITES[q.toLowerCase().trim()]) return { name: q, url: OFFICIAL_SITES[q.toLowerCase().trim()], isOfficial: true };
  if (/^[a-z0-9-]+\.[a-z]{2,}$/i.test(clean)){
    return { name: clean, url: "https://" + clean, isOfficial: false };
  }
  return null;
}

/* ============ محركات البحث ============ */
async function searchWikipedia(q){
  try{
    const params = new URLSearchParams({
      action: "query", generator: "search", gsrsearch: q, gsrlimit: "12",
      prop: "extracts|pageimages|info", explaintext: "1", exintro: "1",
      exlimit: "12", exchars: "600", redirects: "1", inprop: "url",
      piprop: "thumbnail", pithumbsize: "200", format: "json", origin: "*"
    });
    const res = await fetch(`https://ar.wikipedia.org/w/api.php?${params}`, {
      signal: AbortSignal.timeout(8000)
    });
    if (!res.ok) return [];
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return [];
    return Object.values(pages)
      .sort((a,b) => (a.index || 0) - (b.index || 0))
      .map(pg => ({
        title: pg.title || "",
        snippet: (pg.extract || "").trim(),
        url: pg.fullurl || `https://ar.wikipedia.org/wiki/${encodeURIComponent(pg.title || "")}`,
        thumb: pg.thumbnail?.source || "",
        source: "Wikipedia",
        type: "wiki"
      }))
      .filter(r => r.title && r.snippet);
  }catch{ return []; }
}

async function searchDDG(q){
  try{
    const res = await fetch(
      `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1`,
      { signal: AbortSignal.timeout(6000) }
    );
    if (!res.ok) return [];
    const data = await res.json();
    const out = [];
    if (data.AbstractText){
      out.push({
        title: data.Heading || q,
        snippet: data.AbstractText,
        url: data.AbstractURL || `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
        thumb: data.Image ? `https://duckduckgo.com${data.Image}` : "",
        source: "DuckDuckGo",
        type: "sites"
      });
    }
    (data.RelatedTopics || []).slice(0, 8).forEach(t => {
      if (t.Text && t.FirstURL){
        out.push({
          title: t.Text.split(" - ")[0].slice(0, 80) || q,
          snippet: t.Text,
          url: t.FirstURL,
          thumb: "",
          source: "DuckDuckGo",
          type: "sites"
        });
      }
    });
    return out;
  }catch{ return []; }
}

async function searchNews(q){
  try{
    const params = new URLSearchParams({
      action: "query", generator: "search", gsrsearch: q + " أخبار",
      gsrlimit: "6", prop: "extracts|info", explaintext: "1", exintro: "1",
      exchars: "400", inprop: "url", format: "json", origin: "*"
    });
    const res = await fetch(`https://ar.wikipedia.org/w/api.php?${params}`, {
      signal: AbortSignal.timeout(7000)
    });
    if (!res.ok) return [];
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return [];
    return Object.values(pages).slice(0, 6).map(pg => ({
      title: pg.title || "",
      snippet: (pg.extract || "").trim(),
      url: pg.fullurl || "",
      thumb: "",
      source: "Wikipedia",
      type: "news"
    })).filter(r => r.title && r.snippet);
  }catch{ return []; }
}

async function searchImages(q){
  try{
    const params = new URLSearchParams({
      action: "query", generator: "search", gsrsearch: q, gsrnamespace: "6",
      gsrlimit: "12", prop: "imageinfo", iiprop: "url|extmetadata",
      iiurlwidth: "200", format: "json", origin: "*"
    });
    const res = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`, {
      signal: AbortSignal.timeout(7000)
    });
    if (!res.ok) return [];
    const data = await res.json();
    const pages = data?.query?.pages;
    if (!pages) return [];
    return Object.values(pages).map(pg => ({
      title: pg.title?.replace("File:", "") || "",
      snippet: "صورة من ويكيميديا كومنز",
      url: pg.imageinfo?.[0]?.descriptionurl || pg.imageinfo?.[0]?.url || "",
      thumb: pg.imageinfo?.[0]?.thumburl || pg.imageinfo?.[0]?.url || "",
      source: "Wikimedia",
      type: "images"
    })).filter(r => r.thumb);
  }catch{ return []; }
}

async function doSearchAll(q){
  const key = q.toLowerCase().trim();
  if (State.cache.has(key)){
    const c = State.cache.get(key);
    if (Date.now() - c.t < 300000) return c.data;
  }

  const [wiki, ddg, news, imgs] = await Promise.all([
    searchWikipedia(q).catch(() => []),
    searchDDG(q).catch(() => []),
    searchNews(q).catch(() => []),
    searchImages(q).catch(() => [])
  ]);

  const combined = [...wiki, ...ddg, ...news, ...imgs];
  const seen = new Set();
  const unique = combined.filter(r => {
    if (!r.url || !r.title) return false;
    const k = r.url.replace(/\/$/, "").toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });

  State.cache.set(key, { t: Date.now(), data: unique });
  if (State.cache.size > 30){
    const first = State.cache.keys().next().value;
    State.cache.delete(first);
  }
  return unique;
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      () => toast("📋 تم النسخ", "ok", 1500),
      () => fallbackCopy(text)
    );
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); toast("📋 تم النسخ", "ok", 1500); }
  catch{ toast("تعذّر النسخ", "err", 1500); }
  ta.remove();
}

  try{
    let official = null;
    const detected = detectOfficial(q);
    if (detected){
      official = detected;
      renderOfficial(official);
    }

    let results = await doSearchAll(q);
    const filtered = SafeSearch.filterResults(results);

    const ms = Math.round(performance.now() - t0);
    State.currentResults = filtered.visible;
    State.stats.searches++;
    State.stats.lastSearch = now() + " — " + q.slice(0, 30);
    State.stats.lastScan = now();
    updateKali();

    if (filtered.visible.length){
      hideStatus();
      renderAnswer(filtered.visible[0]);
      resultsBar.style.display = "flex";
      resultsBar.innerHTML = `
        <div>📊 عدد النتائج: <b>${filtered.visible.length}</b> — «${esc(q)}»</div>
        <div>⚡ ${ms}ms</div>
      `;
      updateTabCounts(filtered.visible);
      applyTab();
    } else if (!official){
      hideStatus();
      resultsBar.style.display = "none";
      renderResults([]);
    } else {
      hideStatus();
    }

    if (filtered.hidden.length){
      hiddenNote.innerHTML = `
        <div class="hidden-note">
          🛡️ تم إخفاء ${filtered.hidden.length} نتيجة بسبب إعدادات البحث الآمن.
        </div>
      `;
    }

    addHistory(q);
    toast(`✓ اكتمل البحث — ${filtered.visible.length} نتيجة`, "ok", 1800);
  }catch(err){
    setStatus(
      '<div style="font-size:16px">⚠️ تعذر الحصول على النتائج حالياً.</div>',
      "حاول مرة أخرى.",
      doSearch
    );
  }finally{
    State.busy = false;
    goEl.disabled = false;
  }
}

goEl.addEventListener("click", doSearch);
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    suggestions.classList.remove("show");
    doSearch();
  }
});

/* ============ Kali Monitor ============ */
function updateKali(){
  $("#kProt").textContent = "ON";
  $("#kSearch").textContent = State.stats.searches;
  $("#kBlocked").textContent = State.stats.blocked;
  $("#kWarn").textContent = State.stats.warnings;
  $("#kChecked").textContent = State.stats.checked;
  $("#kSafe").textContent = State.safeSearch ? "ON" : "OFF";
  $("#kLast").textContent = State.stats.lastSearch;
  $("#kLastScan").textContent = State.stats.lastScan;
}

function toggleKali(){
  State.kali = !State.kali;
  document.body.classList.toggle("kali", State.kali);
  $("#kaliBtn").classList.toggle("on", State.kali);
  $("#kaliPanel").classList.toggle("show", State.kali);
  updateKali();
  toast(State.kali ? "🛡️ Kali Monitor مفتوح" : "تم الإغلاق", State.kali ? "kali" : "ok", 1500);
}

$("#kaliBtn").addEventListener("click", toggleKali);

/* ============ Settings ============ */
function renderBlockedKeywords(){
  if (!State.blockedKeywords.length) return '<p style="color:var(--txt-3);font-size:12.5px;margin:8px 0">لا توجد كلمات محظورة.</p>';
  return State.blockedKeywords.map(kw => `
    <div class="list-item">
      <span>${esc(kw)}</span>
      <button class="del" data-del-kw="${esc(kw)}" title="حذف">✕</button>
    </div>
  `).join("");
}

function renderBlockedSites(){
  if (!State.blockedSites.length) return '<p style="color:var(--txt-3);font-size:12.5px;margin:8px 0">لا توجد مواقع محظورة.</p>';
  return State.blockedSites.map(s => `
    <div class="list-item">
      <span>${esc(s)}</span>
      <button class="del" data-del-site="${esc(s)}" title="حذف">✕</button>
    </div>
  `).join("");
}

/* ============ Keyboard ============ */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "k"){
    e.preventDefault();
    qEl.focus();
    qEl.select();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "k"){
    e.preventDefault();
    toggleKali();
  }
  if (e.key === "Escape"){
    closeModal();
    suggestions.classList.remove("show");
  }
});

/* ============ بدء التشغيل ============ */
(function init(){
  // المظهر
  State.theme = load("noor171_theme", "dark");
  if (State.theme === "light") document.body.classList.add("light");

  // Splash → App مباشرة (بدون تسجيل دخول)
  setTimeout(() => {
    $("#splash").classList.add("hide");
    $("#app").classList.add("show");

    updateKali();
    renderHistory();
    showWelcome();

    // كشف Kali
    const ua = navigator.userAgent;
    const isKali = /kali/i.test(ua) || /kali/i.test(navigator.platform || "");
    if (isKali){
      setTimeout(() => {
        toggleKali();
        toast("🐧 مرحباً بك يا مستخدم Kali Linux!", "kali", 3500);
      }, 900);
    }

    qEl.focus();
  }, 1800);

  console.log("%c⚡ نور 900 v" + VERSION + " — Security Edition",
    "background:linear-gradient(135deg,#4d8cff,#8b5cf6);color:#fff;padding:10px 20px;border-radius:10px;font-weight:900;font-size:14px;");
  console.log("%c✅ فتح مباشر • Safe Search • Kali Monitor • تبويبات • اقتراحات",
    "color:#10b981;font-size:13px;font-weight:700;");
})();
</script>
